services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todos"]
      interval: 3s
      timeout: 5s
      retries: 15
    ports:
      - "5432:5432"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_USER: todo
      DB_PASSWORD: todo
      DB_NAME: todos
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
